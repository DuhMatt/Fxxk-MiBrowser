name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag, branch, or commit to build
        required: true
        default: main

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare local SDK path
        run: echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties

      - name: Normalize Gradle wrapper
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Rename APK
        run: |
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "Fxxk-MiBrowser-v${VERSION}-unsigned.apk"

      - name: Upload unsigned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fxxk-MiBrowser-release-unsigned
          path: Fxxk-MiBrowser-v*-unsigned.apk
          if-no-files-found: error
          retention-days: 14
