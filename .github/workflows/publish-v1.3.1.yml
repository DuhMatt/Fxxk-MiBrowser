name: Publish v1.3.1 APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sign-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android 35 packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare local SDK path
        run: echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties

      - name: Restore signing files
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          mkdir -p signing
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > signing/hyperos-mishare-release.jks
          {
            printf '%s\n' 'storeFile=../signing/hyperos-mishare-release.jks'
            printf 'storePassword=%s\n' "$RELEASE_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$RELEASE_KEY_PASSWORD"
          } > signing/release-keystore.properties
          chmod 600 signing/hyperos-mishare-release.jks signing/release-keystore.properties

      - name: Normalize Gradle wrapper
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build ordinary and Log APKs
        run: ./gradlew --no-daemon :app:assembleRelease :app:assembleDebug

      - name: Prepare and verify APKs
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          OUT="$RUNNER_TEMP/v1.3.1-assets"
          EXPECTED_CERT="d5075be347963d587597b423b1ccb381c579827212f8d476f1f3c0e2e1691aa3"
          mkdir -p "$OUT"
          cp app/build/outputs/apk/release/app-release.apk "$OUT/app-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$OUT/app-debug.apk"

          release_meta="$("$AAPT" dump badging "$OUT/app-release.apk" | head -n 1)"
          log_meta="$("$AAPT" dump badging "$OUT/app-debug.apk" | head -n 1)"
          case "$release_meta" in
            "package: name='com.hyperosfix.browser' versionCode='24' versionName='1.3.1'"*) ;;
            *) echo "Unexpected ordinary APK metadata: $release_meta"; exit 1 ;;
          esac
          case "$log_meta" in
            "package: name='com.hyperosfix.browser' versionCode='24' versionName='1.3.1-log'"*) ;;
            *) echo "Unexpected Log APK metadata: $log_meta"; exit 1 ;;
          esac

          for apk in "$OUT/app-release.apk" "$OUT/app-debug.apk"; do
            digest="$("$APKSIGNER" verify --print-certs "$apk" | awk -F': ' '/certificate SHA-256 digest:/ {gsub(":", "", $2); print tolower($2); exit}')"
            test "$digest" = "$EXPECTED_CERT"
          done

          "$AAPT" dump xmltree "$OUT/app-release.apk" AndroidManifest.xml > "$RUNNER_TEMP/release-manifest.txt"
          "$AAPT" dump xmltree "$OUT/app-debug.apk" AndroidManifest.xml > "$RUNNER_TEMP/log-manifest.txt"
          if grep -q 'DebugPanelActivity' "$RUNNER_TEMP/release-manifest.txt"; then
            echo "DebugPanelActivity must not be present in the ordinary APK."
            exit 1
          fi
          grep -q 'DebugPanelActivity' "$RUNNER_TEMP/log-manifest.txt"

          sha256sum "$OUT/app-release.apk" "$OUT/app-debug.apk"

      - name: Upload APKs and publish v1.3.1
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.3.1
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json tagName,isDraft \
            | jq -e --arg tag "$RELEASE_TAG" '.tagName == $tag and .isDraft == true' > /dev/null
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/v1.3.1-assets/app-release.apk" \
            "$RUNNER_TEMP/v1.3.1-assets/app-debug.apk" \
            --clobber
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          grep -Fxq 'app-release.apk' <<< "$assets"
          grep -Fxq 'app-debug.apk' <<< "$assets"
          gh release edit "$RELEASE_TAG" --draft=false
          gh release view "$RELEASE_TAG" --json tagName,isDraft \
            | jq -e --arg tag "$RELEASE_TAG" '.tagName == $tag and .isDraft == false' > /dev/null
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          grep -Fxq 'app-release.apk' <<< "$assets"
          grep -Fxq 'app-debug.apk' <<< "$assets"

      - name: Remove signing files
        if: always()
        run: rm -f signing/release-keystore.properties signing/hyperos-mishare-release.jks local.properties
