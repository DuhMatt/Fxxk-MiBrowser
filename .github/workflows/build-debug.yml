name: Build Debug APK (Release-Signed)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode release keystore
        run: |
          mkdir -p signing
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > signing/release-keystore.jks

      - name: Create signing properties
        run: |
          cat > signing/release-keystore.properties << PROPS_EOF
          storeFile=../signing/release-keystore.jks
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          PROPS_EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (signed with release key)
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fxxk-mibrowser-debug
          path: app/build/outputs/apk/debug/app-debug.apk
