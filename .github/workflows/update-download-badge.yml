name: Update Download Badge

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  release:
    types: [published, edited]

permissions:
  contents: write

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout badge-data branch
        uses: actions/checkout@v4
        with:
          ref: badge-data
          fetch-depth: 1

      - name: Sum downloads from both repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LSPOSED_TOKEN: ${{ secrets.LSPOSED_TOKEN }}
        run: |
          MAIN_COUNT=$(gh api repos/DuhMatt/Fxxk-MiBrowser/releases --paginate \
            --jq '[.[].assets[].download_count] | add // 0' 2>/dev/null || echo 0)
          echo "Main repo downloads: $MAIN_COUNT"

          XPOSED_COUNT=0
          if [ -n "$LSPOSED_TOKEN" ]; then
            XPOSED_COUNT=$(GH_TOKEN="$LSPOSED_TOKEN" gh api repos/Xposed-Modules-Repo/com.hyperosfix.browser/releases --paginate \
              --jq '[.[].assets[].download_count] | add // 0' 2>/dev/null || echo 0)
          fi
          echo "Xposed repo downloads: $XPOSED_COUNT"

          TOTAL=$((MAIN_COUNT + XPOSED_COUNT))
          echo "Total: $TOTAL"

          # --- shields.io JSON (backward compat) ---
          cat > downloads.json << EOF
          {
            "schemaVersion": 1,
            "label": "下载量 / Downloads",
            "message": "$TOTAL",
            "color": "efefef",
            "labelColor": "4a4a4a",
            "style": "flat-square"
          }
          EOF

          # --- Custom SVG badge ---
          # Fixed dimensions matching assets/badges/ style
          LEFT_W=185
          RIGHT_W=55
          TOTAL_W=$((LEFT_W + 2 + RIGHT_W))
          H=28
          left_center=$((LEFT_W / 2))
          right_center=$((LEFT_W + 2 + RIGHT_W / 2))
          y_text=$((H / 2 + 1))

          cat > download.svg << 'SVGEOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="__W__" height="__H__">
            <rect width="__W__" height="__H__" fill="#555555" rx="0"/>
            <rect x="1" y="1" width="__LW__" height="__HE__" fill="#1c1c1c" rx="0"/>
            <line x1="__L1__" y1="1" x2="__L1__" y2="__H1__" stroke="#555555" stroke-width="1"/>
            <rect x="__R1__" y="1" width="__RW__" height="__HE__" fill="#f0f0f0" rx="0"/>
            <text x="__LC__" y="__YT__" fill="#cccccc" font-family="Arial, 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12px" text-anchor="middle" dominant-baseline="central">下载量 / Downloads</text>
            <text x="__RC__" y="__YT__" fill="#333333" font-family="Arial, 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13px" font-weight="700" text-anchor="middle" dominant-baseline="central">__TOTAL__</text>
          </svg>
          SVGEOF

          # Replace placeholders
          sed -i "s/__W__/$TOTAL_W/g" download.svg
          sed -i "s/__H__/$H/g" download.svg
          sed -i "s/__LW__/$LEFT_W/g" download.svg
          sed -i "s/__HE__/$((H-2))/g" download.svg
          sed -i "s/__L1__/$((LEFT_W+1))/g" download.svg
          sed -i "s/__H1__/$((H-1))/g" download.svg
          sed -i "s/__R1__/$((LEFT_W+2))/g" download.svg
          sed -i "s/__RW__/$RIGHT_W/g" download.svg
          sed -i "s/__LC__/$left_center/g" download.svg
          sed -i "s/__RC__/$right_center/g" download.svg
          sed -i "s/__YT__/$y_text/g" download.svg
          sed -i "s/__TOTAL__/$TOTAL/g" download.svg

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads.json download.svg
          git diff --cached --quiet || git commit -m "Update download badge: $TOTAL"

      - name: Push badge data
        run: git push origin badge-data
